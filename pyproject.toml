[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-qnn-xrdct"
version = "0.1.0"
description = "Reproducible hybrid quantum-classical XRD-CT phase quantification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.10",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "qiskit>=2.0",
  "qiskit-aer>=0.17",
  "qiskit-ibm-runtime>=0.40",
  "qiskit-machine-learning>=0.8",
  "scipy>=1.12",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

